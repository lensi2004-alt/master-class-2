<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11110f">
  <meta name="description" content="Абдрашит Тулкибайдың бағыттары: энергия, жеке талдау, Браверман курсы мен тесті, зейін тесті, магний және мастер-класс.">
  <title>Абдрашит Тулкибай — бағытты таңдаңыз</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <header class="topbar"><a class="brand" href="#top" aria-label="Басты бет"><span class="brand-mark"><img src="assets/abdrashit-window.jpeg" alt="Абдрашит Тулкибай"></span><span>АБДРАШИТ<br>ТУЛКИБАЙ</span></a><span class="top-note">ӨЗІҢІЗГЕ САЙ БАҒЫТТЫ ТАҢДАҢЫЗ</span></header>
  <main id="top">
    <section class="intro"><div class="eyebrow"><i></i> ӨСУГЕ АРНАЛҒАН БАҒЫТТАР</div><h1>Сізге қай<br><em>бағыт керек?</em></h1></section>
    <section class="products" aria-label="Өнімдер">
      <button class="product-card featured" data-product="energy" aria-label="Энергия курсы"><img class="card-visual" src="assets/card-01.jpg" alt="Күн батар шақтағы тауда отырған адам"><span class="card-index">01</span><span class="card-arrow" aria-hidden="true">→</span></button>
      <button class="product-card" data-product="analysis" aria-label="Жеке талдау"><img class="card-visual" src="assets/card-02.jpg" alt="Абдрашит Тулкибайдың портреті"><span class="card-index">02</span><span class="card-arrow" aria-hidden="true">→</span></button>
      <button class="product-card" data-product="program" aria-label="Браверман курсы"><img class="card-visual" src="assets/card-03.jpg" alt="Браверман курсы: көк түсті ми иллюстрациясы"><span class="card-index">03</span><span class="card-arrow" aria-hidden="true">→</span></button>
      <button class="product-card" data-product="attention" aria-label="Зейін тесті"><img class="card-visual" src="assets/card-04.jpg" alt="Зейінді бейнелейтін көгілдір иллюстрация"><span class="card-index">04</span><span class="card-arrow" aria-hidden="true">→</span></button>
      <button class="product-card" data-product="braverman" aria-label="Браверман тесті"><img class="card-visual" src="assets/card-05.jpg" alt="Күлгін нейропрофиль визуализациясы"><span class="card-index">05</span><span class="card-arrow" aria-hidden="true">→</span></button>
      <button class="product-card magnesium" data-product="magnesium" aria-label="Nurelum Magnesium өнімі"><img class="card-visual" src="assets/card-06.jpg" alt="Nurelum Magnesium 3X құтысы"><span class="card-index">06</span><span class="card-arrow" aria-hidden="true">→</span></button>
      <button class="product-card" data-product="masterclass" aria-label="Мастер-класс"><img class="card-visual" src="assets/card-07.jpg" alt="Мастер-класс: Абдрашит Тулкибай залда тыңдаушылармен"><span class="card-index">07</span><span class="card-arrow" aria-hidden="true">→</span></button>
    </section>
    <footer><span>АБДРАШИТ ТУЛКИБАЙ</span></footer>
  </main>
  <div class="modal" id="modal" aria-hidden="true"><div class="modal-backdrop" data-close></div><section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="close" type="button" aria-label="Жабу" data-close>×</button><div class="modal-main"><div class="modal-art"><img id="modal-image" src="" alt=""></div><div class="modal-kicker" id="modal-kicker"></div><h2 id="modal-title"></h2><p class="modal-lead" id="modal-lead"></p></div><div class="modal-side"><div id="modal-content"></div><div class="modal-action" id="modal-action"></div></div></section></div>
  <script src="app.js"></script>
</body>
</html>
